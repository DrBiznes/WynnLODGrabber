# Publishes WynnLODGrabber to Modrinth and CurseForge (and attaches the jar to the GitHub release).
#
# How to release:
#   1. Bump mod_version in gradle.properties and commit.
#   2. Create a GitHub release (e.g. tag v<version>). The release title becomes the version name,
#      the release notes become the changelog. A tag ending in -alpha/-beta (or a version containing
#      alpha/beta) is published as that release channel.
#   Or run it by hand from the Actions tab (workflow_dispatch); that skips the GitHub upload.
#   Releases tagged LOD-* (LOD data) are skipped.
#
# Needs repository secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN.
# A platform with an empty project ID below is skipped.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  MODRINTH_ID: "Rau5VAYE"
  CURSEFORGE_ID: "1135554"

jobs:
  publish:
    # LOD data releases (tags LOD-*) only carry zips and must not publish a mod version.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'LOD-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Publish
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_ID != '' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_ID != '' && secrets.CURSEFORGE_TOKEN || '' }}
          github-token: ${{ github.event_name == 'release' && secrets.GITHUB_TOKEN || '' }}

          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          dependencies: |
            fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}
            distanthorizons(optional){modrinth:distanthorizons}{curseforge:distant-horizons}
            voxy(optional){modrinth:voxy}#(ignore:curseforge)
